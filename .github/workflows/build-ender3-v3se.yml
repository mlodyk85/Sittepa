name: Build Ender3 V3 SE C13 SAFE Pause Layer

on:
  push:
    branches:
      - ender3-v3se-c13-layer-pause-safe
    paths:
      - "ender3-v3se/**"
      - ".github/workflows/build-ender3-v3se.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get exact tested C13/GD303 source
        run: |
          mkdir firmware-src
          cd firmware-src
          git init
          git remote add origin https://github.com/navaismo/Ender-3V3-SE.git
          git fetch --depth 1 origin e714e1e657c37653eebc82c0d793c5f9de329ead
          git checkout FETCH_HEAD
          test "$(git rev-parse HEAD)" = "e714e1e657c37653eebc82c0d793c5f9de329ead"
          grep -n "BOARD_CREALITY_V3_GD303" Marlin/Configuration.h
          grep -n "default_envs = STM32F103RET6_creality" platformio.ini

      - name: Apply SAFE Layers + Pause Layer patch
        run: |
          python ender3-v3se/apply_patch.py firmware-src
          grep -n "DWIN_SetLayerInfo" firmware-src/Marlin/src/gcode/lcd/M73.cpp
          grep -n "Pause Layer" firmware-src/Marlin/src/lcd/dwin/e3v2/dwin.cpp
          ! grep -q "LayerPauseMenu" firmware-src/Marlin/src/lcd/dwin/e3v2/dwin.h

      - name: Install PlatformIO
        run: python -m pip install --upgrade "platformio>=6.1,<7"

      - name: Build C13 SAFE firmware
        working-directory: firmware-src
        run: pio run -e STM32F103RET6_creality

      - name: Collect firmware
        run: |
          mkdir -p artifacts downloads
          BIN="$(find firmware-src/.pio/build/STM32F103RET6_creality -maxdepth 1 -type f -name '*.bin' | head -n 1)"
          test -n "$BIN"
          cp "$BIN" artifacts/Ender3V3SE_C13_GD303_Layers_PauseLayer_SAFE.bin
          sha256sum artifacts/Ender3V3SE_C13_GD303_Layers_PauseLayer_SAFE.bin | tee artifacts/SHA256_SAFE.txt
          stat -c "Firmware bytes: %s" artifacts/Ender3V3SE_C13_GD303_Layers_PauseLayer_SAFE.bin
          cp artifacts/Ender3V3SE_C13_GD303_Layers_PauseLayer_SAFE.bin downloads/
          cp artifacts/SHA256_SAFE.txt downloads/
          (
            cd artifacts
            zip -9 ../downloads/Ender3V3SE_C13_Layers_PauseLayer_SAFE.zip               Ender3V3SE_C13_GD303_Layers_PauseLayer_SAFE.bin               SHA256_SAFE.txt
          )

      - name: Publish direct-download files to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/
          git commit -m "Publish SAFE Pause Layer firmware" || exit 0
          git push origin HEAD:ender3-v3se-c13-layer-pause-safe

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Ender3V3SE-C13-Layers-PauseLayer-SAFE
          path: artifacts/
          if-no-files-found: error
