name: Build Ender3 V3 SE C13 Layers + 3x Pause

on:
  push:
    branches:
      - ender3-v3se-c13-layer-pause
    paths:
      - "ender3-v3se/**"
      - ".github/workflows/build-ender3-v3se.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get pinned tested C13/GD303 source
        run: |
          mkdir firmware-src
          cd firmware-src
          git init
          git remote add origin https://github.com/navaismo/Ender-3V3-SE.git
          git fetch --depth 1 origin e714e1e657c37653eebc82c0d793c5f9de329ead
          git checkout FETCH_HEAD
          git rev-parse HEAD
          grep -n "BOARD_CREALITY_V3_GD303" Marlin/Configuration.h
          grep -n "default_envs = STM32F103RET6_creality" platformio.ini
          grep -n "PAUSE_PARK_NOZZLE_TIMEOUT" Marlin/Configuration_adv.h

      - name: Apply Layers + Layer Pause patch
        run: |
          python ender3-v3se/apply_patch.py firmware-src
          grep -n "DWIN_SetLayerInfo" firmware-src/Marlin/src/gcode/lcd/M73.cpp
          grep -n "Layer %u/%u" firmware-src/Marlin/src/lcd/dwin/e3v2/dwin.cpp
          grep -n "Layer Pause" firmware-src/Marlin/src/lcd/dwin/e3v2/dwin.cpp
          grep -n "LayerPauseMenu" firmware-src/Marlin/src/lcd/dwin/e3v2/dwin.h

      - name: Install PlatformIO
        run: python -m pip install --upgrade "platformio>=6.1,<7"

      - name: Build C13 firmware
        working-directory: firmware-src
        run: pio run -e STM32F103RET6_creality

      - name: Collect firmware
        run: |
          mkdir -p artifacts downloads
          BIN="$(find firmware-src/.pio/build/STM32F103RET6_creality -maxdepth 1 -type f -name '*.bin' | head -n 1)"
          test -n "$BIN"
          cp "$BIN" artifacts/Ender3V3SE_C13_GD303_Layers_3xPause_M600.bin
          cp ender3-v3se/gcode_layers_colors.py artifacts/gcode_layers_colors.py
          sha256sum artifacts/Ender3V3SE_C13_GD303_Layers_3xPause_M600.bin | tee artifacts/SHA256.txt
          stat -c "Firmware bytes: %s" artifacts/Ender3V3SE_C13_GD303_Layers_3xPause_M600.bin

          cp artifacts/Ender3V3SE_C13_GD303_Layers_3xPause_M600.bin downloads/
          cp artifacts/gcode_layers_colors.py downloads/
          cp artifacts/SHA256.txt downloads/
          (
            cd artifacts
            zip -9 ../downloads/Ender3V3SE_C13_Layers_3xPause_M600.zip               Ender3V3SE_C13_GD303_Layers_3xPause_M600.bin               gcode_layers_colors.py               SHA256.txt
          )

      - name: Publish direct-download files to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/
          git commit -m "Publish C13 Layers + 3x Pause firmware" || exit 0
          git push origin HEAD:ender3-v3se-c13-layer-pause

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Ender3V3SE-C13-Layers-3xPause-M600
          path: artifacts/
          if-no-files-found: error
